name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # Runs the committed bundle as a real action step. No real providers are
    # registered yet (Phase 2 adds Telegram), so the action must load and then
    # reject the target with a configuration error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: notify
        uses: ./
        continue-on-error: true
        with:
          dry-run: true
          targets: '[{ provider: telegram, token: dummy, chat_id: "1" }]'
      - name: Expect a configuration error
        if: steps.notify.outcome != 'failure'
        run: exit 1
