name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # Runs the committed bundle as a real action step, as a dry run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: notify
        uses: ./
        with:
          dry-run: true
          status: success
          telegram-bot-token: '123456:dry-run-token'
          telegram-chat-id: '-1001234567890'
      - name: Check outputs
        env:
          SUCCESS: ${{ steps.notify.outputs.success-count }}
          RESULTS: ${{ steps.notify.outputs.results }}
        run: |
          echo "$RESULTS"
          test "$SUCCESS" = 1
